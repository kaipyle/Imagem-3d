<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bretes 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
:root { --paper: #f0eee7; --ink: #1d211d; --muted: #5d625a; --cream: #f2ede0; --sb: #1d4a2c; --bv: #1c3a29; color-scheme: light; }
html, body { margin: 0; min-height: 100%; }
body { min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.5 "Source Sans 3", "Segoe UI", system-ui, sans-serif; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
main { width: min(760px, 100%); }
h1 { margin: 0; font-size: 26px; }
.lead { margin: 4px 0 22px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
a.card { display: flex; flex-direction: column; gap: 6px; padding: 22px 22px 18px; border-radius: 16px; color: var(--cream); text-decoration: none; box-shadow: 0 10px 28px rgba(20, 40, 28, .16); transition: transform .15s; }
a.card:hover { transform: translateY(-2px); }
a.card:focus-visible { outline: 3px solid #e3b341; outline-offset: 3px; }
.sb { background: var(--sb); }
.bv { background: var(--bv); }
.name { font-size: 44px; line-height: 1; }
.sb .name { font-family: "Caveat", "Segoe Print", cursive; }
.bv .name { font-family: "Playfair Display", Georgia, serif; font-size: 34px; letter-spacing: .02em; padding-top: 6px; }
.tag { opacity: .85; }
.dims { margin-top: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.go { margin-top: 8px; font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Bretes de contenção em 3D</h1>
  <p class="lead">Escolha o projeto. Os dois giram, abrem e simulam o manejo; no celular, use o menu de baixo.</p>
  <div class="grid">
    <a class="card sb" href="SafeBov-3D.html">
      <span class="name">SafeBov</span>
      <span class="tag">Mais segurança, bem-estar e praticidade no manejo.</span>
      <span class="dims">2,80 × 0,90 × 2,10 m</span>
      <span class="go">Abrir modelo →</span>
    </a>
    <a class="card bv" href="BOVICARE-3D.html">
      <span class="name">BOVICARE</span>
      <span class="tag">Brete de contenção inteligente.</span>
      <span class="dims">3,50 × 0,90–1,00 × 2,10 m</span>
      <span class="go">Abrir modelo →</span>
    </a>
  </div>
</main>
</body>
</html>
